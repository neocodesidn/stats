# Konfigurasi Upptime untuk NEOBLOX
# Dokumentasi lengkap: https://upptime.js.org/docs/configuration

owner: neocodesidn
repo: neoblox-status

sites:
  - name: NEOBLOX Website
    url: https://neoblox.biz.id
  - name: NEOBLOX Share Code
    url: https://neoblox.biz.id/share-code
    icon: https://neoblox.biz.id/favicon.ico

status-website:
  name: NEOBLOX Status
  cname: status.neoblox.biz.id
  theme: auto
  navbar:
    - href: https://neoblox.biz.id
      name: Kembali ke NEOBLOX
  logoUrl: https://neoblox.biz.id/favicon.ico
  introTitle: >
    Status layanan NEOBLOX secara real-time. Halaman ini diperbarui otomatis
    setiap 5 menit oleh Upptime.

# Cek setiap 5 menit (bawaan Upptime, bisa diubah kalau perlu lebih jarang/cepat)
delay: 5

# Notifikasi kalau ada layanan down (opsional, isi kalau mau dapat alert)
# notifications:
